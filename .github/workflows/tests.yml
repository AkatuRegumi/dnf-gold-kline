name: Validate DNF gold quote collector and page
on:
  push:
    paths:
      - 'collector/**'
      - 'docs/index.html'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'collector/**'
      - 'docs/index.html'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python unit regression
        run: python -m unittest discover -s tests -v
      - name: Browser script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('docs/index.html').read_text(encoding='utf-8')
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/dnf-gold-page.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/dnf-gold-page.js
