name: Capture DNF gold quote
on:
  schedule:
    # Select by the triggering cron expression, NOT delayed runner wall-clock time.
    - cron: '23 0,12 * * *' # group0: kua1, kua3b, kua6
    - cron: '23 4,16 * * *' # group1: kua2, kua4, kua7
    - cron: '23 8,20 * * *' # group2: kua3a, kua5, kua8
  workflow_dispatch:
    inputs:
      region:
        description: 'Capture a staggered group, all regions or one specific region'
        type: choice
        default: scheduled
        options: [scheduled, all, kua1, kua2, kua3a, kua3b, kua4, kua5, kua6, kua7, kua8]
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'docs/data/regions.json'
      - '.github/workflows/collect.yml'
permissions:
  contents: write
concurrency:
  group: dnf-price-history
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright for rendered page quotes
        run: python -m pip install --disable-pip-version-check playwright
      - name: Collect independent snapshots for each region
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_REGION: ${{ github.event.inputs.region || 'scheduled' }}
        run: |
          selected="$REQUESTED_REGION"
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$EVENT_SCHEDULE" in
              '23 0,12 * * *') selected=group0 ;;
              '23 4,16 * * *') selected=group1 ;;
              '23 8,20 * * *') selected=group2 ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 1 ;;
            esac
          fi
          python -m collector.browser_collect --region "$selected"
      - name: Commit genuine data and collection health
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          if git diff --quiet -- docs/data/; then
            echo 'No new data'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/data/
          git commit -m 'data: append verified cross-region quote snapshots'
          git pull --rebase origin main
          git push
