name: Capture DNF gold quote
on:
  schedule:
    - cron: '23 */4 * * *' # three markets/sweep, six sweeps/day UTC
  workflow_dispatch:
    inputs:
      region:
        description: 'Capture a staggered group, all regions or one specific region'
        type: choice
        default: scheduled
        options: [scheduled, all, kua1, kua2, kua3a, kua3b, kua4, kua5, kua6, kua7, kua8]
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'docs/data/regions.json'
      - '.github/workflows/collect.yml'
permissions:
  contents: write
concurrency:
  group: dnf-price-history
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect independent snapshots for each region
        run: python -m collector.collect --region "${{ github.event.inputs.region || 'scheduled' }}"
      - name: Commit only genuine new data
        run: |
          if git diff --quiet -- docs/data/; then
            echo 'No new data'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/data/
          git commit -m 'data: append verified cross-region quote snapshots'
          git pull --rebase origin main
          git push
