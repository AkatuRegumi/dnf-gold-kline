name: Capture DNF gold quote
on:
  schedule:
    - cron: '23 */8 * * *' # three sweeps/day UTC, best effort
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'docs/data/regions.json'
      - '.github/workflows/collect.yml'
permissions:
  contents: write
concurrency:
  group: dnf-price-history
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect independent snapshots for each region
        run: python -m collector.collect --region all
      - name: Commit only genuine new data
        run: |
          if git diff --quiet -- docs/data/; then
            echo 'No new data'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/data/
          git commit -m 'data: append verified cross-region quote snapshots'
          git push
