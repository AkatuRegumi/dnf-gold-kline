name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Check embedded chart JavaScript syntax
        run: python -c "from pathlib import Path; p=Path('docs/index.html').read_text(encoding='utf-8'); Path('/tmp/dnf-chart.js').write_text(p.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')" && node --check /tmp/dnf-chart.js
      - name: Browser interaction smoke test (local-only static site)
        run: |
          python -m pip install --disable-pip-version-check playwright
          python tests/browser_chart_hover.py

      - name: Probe cross-two YXDR rendered HTML once (diagnostic, non-blocking)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 3
        run: python -m collector.browser_collect --region kua2 --dry-run
