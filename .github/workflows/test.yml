name: Tests
on:
  push:
    # Quote-only commits happen up to 72 times/day after hourly capture.
    # Keep code coverage while avoiding a full Chrome CI run per data update.
    paths-ignore:
      - 'docs/data/**'
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Validate standalone quote model, chart code and hourly data contracts
        run: |
          node --check docs/market-data.js
          node --check docs/terminal.js
          node tests/frontend_data_contract.js
      - name: Browser interaction smoke test (local-only static site)
        run: |
          python -m pip install --disable-pip-version-check playwright
          python tests/browser_chart_hover.py

